<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice INV-2201</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body style="background:#EDF1F5">
<main class="main" style="padding:28px">
  <p class="eyebrow">Popup</p>
  <h1>Invoice INV-2201</h1>
  <p class="lede">Opened with <span class="code">window.open</span>. Work here, then assert the opener still has the desk.</p>
  <div class="card">
    <span class="card__label">Hearthline · open</span>
    <p>Total <strong>$18,400</strong></p>
    <label class="check"><input type="checkbox" data-testid="invoice-approve"> Mark reviewed</label>
    <div class="btnrow">
      <button class="btn" data-testid="invoice-note">Send note to opener</button>
      <button class="btn btn--ghost" data-testid="invoice-close">Close</button>
    </div>
    <div class="out" data-testid="invoice-out"></div>
  </div>
</main>
<script>
document.querySelector('[data-testid="invoice-note"]').addEventListener('click', function () {
  const payload = { __gym: 'log', kind: 'popup-note', detail: 'INV-2201 reviewed=' + document.querySelector('[data-testid="invoice-approve"]').checked };
  try { if (window.opener) window.opener.postMessage(payload, '*'); } catch (_) {}
  document.querySelector('[data-testid="invoice-out"]').textContent = 'note sent';
});
document.querySelector('[data-testid="invoice-close"]').addEventListener('click', function () { window.close(); });
</script>
</body>
</html>
